[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekon"
version = "0.2.0"
description = "A production-grade CLI coding agent with persistent memory and intelligent checkpoints"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Asif", email = "asif@example.com" },
]
keywords = [
    "ai",
    "agent",
    "cli",
    "coding-agent",
    "mcp",
    "persistent-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "gitpython>=3.1.0",
    "mcp>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
rekon = "rekon.cli:cli"

[project.urls]
Homepage = "https://github.com/code-asif/rekon"
Repository = "https://github.com/code-asif/rekon"
Issues = "https://github.com/code-asif/rekon/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rekon"]

[tool.hatch.build.targets.sdist]
include = ["src/rekon"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rekon"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
